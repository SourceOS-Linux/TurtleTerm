ShortDescription: AI agent terminal fabric for SourceOS — WezTerm + 37 agent commands
Description: |
  TurtleTerm is a WezTerm-based terminal emulator with a full AI agent fabric built in.

  Features:
  - Self-hosted AI co-pilot (Claude API, Ollama, Noetica backends)
  - Full gh CLI parity via turtle-gh with Gitea-sovereign forge
  - 37+ agent commands via turtle-agentd (190+ actions)
  - MCP server for Claude Code integration
  - PowerShell integration: ALT+/ AI completion, ALT+G NL-to-shell, F2 risk check
  - Project env management with .turtle/env.yaml
  - AI patch application, agent pipelines, workspace intelligence
