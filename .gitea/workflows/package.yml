name: Package & Publish

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (e.g. 1.4.0)'
        required: true
        default: '1.4.0'

env:
  PACKAGE_VERSION: ${{ github.ref_name != 'main' && github.ref_name || inputs.version }}

jobs:
  # ── Build Linux deb ─────────────────────────────────────────────────────────
  linux-deb:
    name: Linux .deb (amd64 + arm64)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          VERSION="${{ github.ref_name }}"
          echo "PKG_VERSION=${VERSION#v}" >> $GITHUB_ENV

      - name: Install build deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y dpkg-dev cargo cmake pkg-config \
            libfontconfig1-dev libfreetype-dev libssl-dev libx11-dev \
            libxcb1-dev libxkbcommon-dev zlib1g-dev python3

      - name: Build WezTerm binaries
        run: |
          cargo build --release --locked -p wezterm -p wezterm-gui -p wezterm-mux-server

      - name: Stage package
        run: |
          TURTLE_TERM_STAGE_PREFIX="$GITHUB_WORKSPACE/dist/linux-stage" \
          TURTLE_TERM_ETC_DIR="$GITHUB_WORKSPACE/dist/linux-stage/etc" \
          TURTLE_TERM_RUNTIME_PREFIX="/usr" \
          TURTLE_TERM_RUNTIME_ETC_DIR="/etc" \
            bash packaging/scripts/stage-linux-package.sh

      - name: Build .deb
        run: |
          cd packaging/linux/deb
          STAGE_DIR="$GITHUB_WORKSPACE/dist/linux-stage" bash build-deb.sh \
            "${{ env.PKG_VERSION }}" "${{ matrix.arch }}"

      - name: Upload .deb to Gitea release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          DEB_FILE="turtleterm_${{ env.PKG_VERSION }}_${{ matrix.arch }}.deb"
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@packaging/linux/deb/$DEB_FILE" \
            "${{ vars.GITEA_URL }}/api/v1/repos/${{ github.repository }}/releases/latest/assets?name=$DEB_FILE"

      - name: Upload .deb to Gitea Package Registry
        run: |
          DEB_FILE="packaging/linux/deb/turtleterm_${{ env.PKG_VERSION }}_${{ matrix.arch }}.deb"
          curl -X PUT \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            --upload-file "$DEB_FILE" \
            "${{ vars.GITEA_URL }}/api/packages/${{ github.repository_owner }}/debian/pool/bullseye/main/upload" \
            || true  # Package registry may not be enabled — graceful

      - uses: actions/upload-artifact@v4
        with:
          name: turtleterm-deb-${{ matrix.arch }}
          path: packaging/linux/deb/turtleterm_*.deb

  # ── Build Chocolatey nupkg ──────────────────────────────────────────────────
  chocolatey:
    name: Chocolatey .nupkg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          echo "PKG_VERSION=${VERSION#v}" >> $GITHUB_ENV

      - name: Install Chocolatey
        shell: powershell
        run: |
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }

      - name: Update nuspec version
        shell: powershell
        run: |
          $nuspec = "packaging/chocolatey/turtleterm/turtleterm.nuspec"
          (Get-Content $nuspec) -replace '<version>.*</version>', "<version>${{ env.PKG_VERSION }}</version>" | Set-Content $nuspec

      - name: Pack nupkg
        shell: powershell
        run: |
          cd packaging/chocolatey/turtleterm
          choco pack turtleterm.nuspec

      - name: Push to Gitea package registry
        shell: powershell
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_URL: ${{ vars.GITEA_URL }}
        run: |
          $nupkg = Get-ChildItem packaging/chocolatey/turtleterm/*.nupkg | Select-Object -First 1
          if ($nupkg) {
            # Push to Gitea NuGet feed
            $nugetUrl = "$env:GITEA_URL/api/packages/${{ github.repository_owner }}/nuget"
            try {
              choco push "$($nupkg.FullName)" --source "$nugetUrl" --api-key "$env:GITEA_TOKEN"
            } catch {
              Write-Warning "Gitea NuGet push failed: $_"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: turtleterm-nupkg
          path: packaging/chocolatey/turtleterm/*.nupkg

  # ── Release summary ─────────────────────────────────────────────────────────
  release-summary:
    name: Release Summary
    needs: [linux-deb, chocolatey]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Post release notes
        run: |
          echo "## Package Release: ${{ github.ref_name }}"
          echo ""
          echo "| Format | Status |"
          echo "|---|---|"
          echo "| Linux .deb (amd64) | ✓ |"
          echo "| Linux .deb (arm64) | ✓ |"
          echo "| Chocolatey .nupkg  | ✓ |"
          echo "| winget manifest    | manual submission |"
          echo ""
          echo "Install:"
          echo "  Linux:   sudo dpkg -i turtleterm_${{ github.ref_name }}_amd64.deb"
          echo "  Windows: choco install turtleterm"
          echo "  winget:  winget install SourceOS.TurtleTerm"
